name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sensitive-data:
    name: Détection de données sensibles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/check-sensitive.py

  backend:
    name: Backend (lint, tests, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Installer les dépendances (sans les paquets GPU, inutiles pour les tests)
        run: |
          python -m pip install --upgrade pip
          grep -viE '^(#|nvidia-|ctranslate2|onnxruntime|faster-whisper|av==|hf-xet|huggingface|tokenizers)' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt -r requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Tests
        working-directory: backend
        run: pytest -q
      - name: Audit des dépendances Python (versions épinglées)
        run: pip-audit -r requirements.txt --no-deps --disable-pip

  frontend:
    name: Interface Angular (build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  electron:
    name: Electron (contrôle, test du bootstrap)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci
      - name: Contrôle de syntaxe
        run: |
          node --check main.js
          node --check preload.js
          node --check bootstrap.js
      - name: Récupérer uv (empreinte SHA-256 vérifiée)
        run: node scripts/fetch-uv.mjs
      - name: Test du bootstrap Python (crée un vrai environnement minimal)
        run: npm test
      - run: npm audit --omit=dev --audit-level=high
